name: Build Android APK and Web App

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-android-apk:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: 'npm'

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '21'

    - name: Install Node Dependencies
      run: npm install

    - name: 1. Run Web Build First
      run: npm run build

    - name: 2. Configure Capacitor and Prepare Android Platform
      run: |
        npm install @capacitor/core @capacitor/cli @capacitor/android
        npx cap add android || true
        npx cap sync android

    - name: 2.5 Align Kotlin Versions & Resolution Strategy
      run: node patch-gradle.js

    - name: 3. Build APK using Gradle
      run: |
        export ANDROID_HOME=$ANDROID_SDK_ROOT
        echo "sdk.dir=$ANDROID_SDK_ROOT" > android/local.properties
        
        cd android
        chmod +x gradlew
        ./gradlew assembleDebug

    - name: 4. Upload APK as Artifact
      uses: actions/upload-artifact@v4
      with:
        name: soundlink-android-apk
        path: |
          android/app/build/outputs/apk/debug/app-debug.apk
          dist/
        if-no-files-found: error





