name: Build Android APK and Web App

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-android-apk:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: 'npm'

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Install Node Dependencies
      run: npm install

    - name: Build Web Application (Vite Dist)
      run: npm run build

    - name: Install Capacitor Core, CLI & Android Platform
      run: |
        npm install @capacitor/core @capacitor/cli @capacitor/android
        npx cap init "SoundLink" "com.soundlink.app" --web-dir dist --yes || true
        npx cap add android || true
        npx cap sync android

    - name: Accept Android SDK Licenses & Build APK
      run: |
        export ANDROID_HOME=$ANDROID_SDK_ROOT
        echo "sdk.dir=$ANDROID_SDK_ROOT" > android/local.properties
        
        cd android
        chmod +x gradlew
        ./gradlew assembleDebug --warning-mode all

    - name: Upload Android APK & Build Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: soundlink-android-apk
        path: |
          android/app/build/outputs/apk/debug/app-debug.apk
          dist/
          *.apk
        if-no-files-found: error



